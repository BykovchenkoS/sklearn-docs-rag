name: Nginx sonya

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Add /sonya/rags/ location and reload nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            CONF=/etc/nginx/sites-available/sites
            BAK="$CONF.bak.$(date +%Y%m%d%H%M%S)"
            cp "$CONF" "$BAK"
            echo "backup: $BAK"

            python3 - "$CONF" << 'PY'
            import sys
            conf = sys.argv[1]
            s = open(conf).read()
            if "/sonya/rags/" in s:
                print("sonya location already present, nothing to do")
                sys.exit(0)
            block = '''    location = /sonya/rags { return 301 /sonya/rags/; }
                location /sonya/rags/ {
                    proxy_pass http://127.0.0.1:9000/;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_buffering off;
                    proxy_read_timeout 300s;
                }
            '''
            anchor = "    location = /alex/rags { return 301 /alex/rags/; }"
            if anchor not in s:
                print("ANCHOR NOT FOUND")
                sys.exit(2)
            s = s.replace(anchor, block + anchor, 1)
            open(conf, "w").write(s)
            print("inserted sonya location")
            PY

            if nginx -t; then
              systemctl reload nginx
              echo "nginx reloaded"
            else
              cp "$BAK" "$CONF"
              echo "nginx -t FAILED, config restored from backup"
              exit 1
            fi
