name: Server info

on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Collect server info
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "===== hostname ====="
            hostname
            echo "===== docker ps ====="
            docker ps
            echo "===== listening ports ====="
            ss -tlnp | grep -E ':(80|443|8000|9000|6333)\b' || true
            echo "===== nginx sites-enabled ====="
            ls -la /etc/nginx/sites-enabled/ 2>/dev/null || echo "no sites-enabled"
            echo "===== nginx configs ====="
            for f in /etc/nginx/sites-enabled/*; do echo "----- $f -----"; cat "$f"; done 2>/dev/null || true
