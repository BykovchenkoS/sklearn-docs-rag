networks:
  sonya-rag-net:
    name: sonya-rag-net
    external: false

services:
  app:
    build: .
    image: ghcr.io/bykovchenkos/sklearn-docs-rag:latest
    container_name: sonya-rag
    ports:
      # Внешний порт задаётся через APP_PORT; внутренний порт — 8000.
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Между контейнерами Qdrant доступен по внутреннему порту 6333.
      - QDRANT_URL=http://qdrant:6333
    networks:
      - sonya-rag-net
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: sonya-qdrant
    ports:
      # Внешний порт задаётся через QDRANT_PORT; внутренний — 6333.
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage
    networks:
      - sonya-rag-net
    restart: unless-stopped
